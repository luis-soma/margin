<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margin</title>
<meta name="description" content="Margin is a Mac app that documents your design process while you work. Double-press ⌘, add one line about why, and it lands in an archive.">
<meta property="og:title" content="Margin">
<meta property="og:description" content="Document your design process while you work. A Mac app.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M13 8H9v16h4' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='16' r='2.8' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* One screen, no scroll: one message, two buttons, the real app on a MacBook. */
@font-face { font-family: "Mona"; src: url({{ASSETS}}fonts/MonaSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Mona"; src: url({{ASSETS}}fonts/MonaSans-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Mona Display"; src: url({{ASSETS}}fonts/MonaSansDisplay-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url({{ASSETS}}fonts/GeistMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
:root {
  /* Margin's own tokens (Theme.swift): one neutral ramp, ink controls, 8 pt corners */
  --paper: #fff; --ink: #111; --ink2: rgba(17,17,17,.6); --ink3: rgba(17,17,17,.4);
  --hair: rgba(17,17,17,.08); --fill: rgba(17,17,17,.04); --fill-hover: rgba(17,17,17,.06);
  --control: 8px; --chip: 4px;
  --card-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --read: "Mona", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Mona Display", var(--read);
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  color: var(--ink); font: 400 15px/1.45 var(--read); -webkit-font-smoothing: antialiased;
  /* A quiet, neutral light: brighter at the top, settling into grey */
  background:
    radial-gradient(120% 70% at 50% -10%, #fff 0%, rgba(255,255,255,0) 60%),
    radial-gradient(60% 50% at 85% 75%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(#f7f7f6, #ececea);
  display: flex; flex-direction: column;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

header { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px clamp(16px, 2.4vw, 28px); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand a { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 16px; }
.brand svg { width: 21px; height: 21px; }
/* The version is data, so it is set in Geist Mono on a chip */
.pill { height: 20px; padding: 0 6px; border-radius: var(--chip); background: var(--fill); display: inline-flex; align-items: center; font: 400 11px/1 var(--mono); color: var(--ink2); }
/* A header tool: no fill at rest, the fill on hover */
.nav { height: 32px; padding: 0 12px; border-radius: var(--control); display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--ink2); transition: background .12s ease-out, color .12s ease-out; }
.nav:hover { background: var(--fill-hover); color: var(--ink); }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: clamp(4px, 3vh, 40px) 16px 0; }
h1 { margin: 0; font: 500 clamp(32px, 4.2vw, 56px)/1.02 var(--display); letter-spacing: -.022em; text-wrap: balance; }
.sub { margin: 14px 0 0; max-width: 30em; font-size: clamp(15px, 1.3vw, 18px); line-height: 1.45; color: var(--ink2); text-wrap: balance; }
.cta { flex: none; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: clamp(16px, 3vh, 28px); }
/* Margin's buttons: 8 pt continuous corners, Mona Sans medium, a press to 0.97 */
.btn { position: relative; height: 40px; padding: 0 16px; border: 0; border-radius: var(--control); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px/1 var(--read); cursor: pointer; transition: background-color .12s ease-out, opacity .12s ease-out, transform .1s ease-out; }
.btn:active { transform: scale(.97); }
.btn svg { width: 14px; height: 14px; }
/* Primary: ink, words reversed out; dims a touch on hover */
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.dark:hover { opacity: .86; }
/* Secondary: a floating control, white with a hairline and the card shadow */
.btn.light { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair), var(--card-shadow); }
.btn.light:hover { background: linear-gradient(var(--fill), var(--fill)) var(--paper); }
/* "Copied" replaces the label in place, so the button never changes width */
.btn .now { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s ease; }
.btn .was { transition: opacity .15s ease; }
.btn.done .now { opacity: 1; } .btn.done .was { opacity: 0; }

/* The real app on a display-only MacBook, running off the bottom of the screen */
.stage { flex: 1; min-height: 0; width: 100%; margin-top: clamp(16px, 4vh, 44px); display: flex; align-items: flex-end; justify-content: center; }
.stage video { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; mix-blend-mode: multiply; animation: rise 1s var(--ease) .1s backwards; }
@media (max-aspect-ratio: 4/5) { .stage video { object-fit: cover; object-position: 50% 100%; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }

@media (max-width: 600px) {
  h1 br { display: none; }
  .cta { flex-direction: column; width: 100%; max-width: 360px; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .stage video { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 7H8v18h5" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="19.5" cy="16" r="3" fill="currentColor"/></svg>Margin</a>
    <span class="pill">v0.4.0</span>
  </div>
  <a class="nav" href="https://github.com/luis-soma/margin">GitHub</a>
</header>

<main>
  <h1>Document your design process <br>while you work</h1>
  <p class="sub">Double-press ⌘ on whatever you’re working on and add one line about why. Free and open source for your Mac.</p>
  <div class="cta">
    <a class="btn dark" href="https://github.com/luis-soma/margin/releases/latest/download/Margin.dmg"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L5 7m3 3 3-3M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Download for Mac</a>
    <button class="btn light" id="copy" type="button" title="Install Margin by following https://raw.githubusercontent.com/luis-soma/margin/main/INSTALL.md"><span class="was">Copy agent prompt</span><span class="now" aria-hidden="true">Copied</span></button>
  </div>
  <div class="stage">
    <video src="{{ASSETS}}media/margin-capture.mp4" poster="{{ASSETS}}media/margin-capture.jpg" autoplay muted loop playsinline preload="auto" aria-label="Selecting a Figma frame, double-pressing ⌘, typing one line about why and pressing return"></video>
  </div>
</main>

<script>
  const copy = document.getElementById('copy');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copy.title); } catch (e) { return; }
    copy.classList.add('done'); clearTimeout(copy.t); copy.t = setTimeout(() => copy.classList.remove('done'), 1600);
  });
</script>
</body>
</html>
