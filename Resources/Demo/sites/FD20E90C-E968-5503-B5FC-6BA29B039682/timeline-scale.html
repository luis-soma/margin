<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one full-height instrument. Controls on top; below, Margin's archive
   as a canvas: date labels, the rail under study, then the captures. */
:root {
  --paper: #F2F2EF;
  --raised: #FAFAF8;
  --ink: #17171A;
  --muted: #8B8B86;
  --line: #DCDCD7;
  --sans: "DM Sans", system-ui, -apple-system, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161617; --raised: #1E1E20; --ink: #ECECE8; --muted: #7D7D78; --line: #2E2E31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161617; --raised: #1E1E20; --ink: #ECECE8; --muted: #7D7D78; --line: #2E2E31;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
header { display: flex; flex-direction: column; gap: 12px; padding-block: 16px 12px; border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
h1 span { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; margin-left: auto; flex-wrap: wrap; }
.tabs button {
  font: 500 13px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 7px;
  padding: 6px 12px; cursor: pointer; display: flex; gap: 7px; align-items: baseline;
}
.tabs button kbd { font: 400 10px var(--mono); opacity: 0.7; }
.tabs .group { font: 400 10px var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 6px 0 10px; align-self: center; }
.tabs .group:not(:first-child) { border-left: 1px solid var(--line); margin-left: 6px; padding-left: 14px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:focus-visible, #slider:focus-visible, .toggle input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
#slider { flex: 1 1 320px; max-width: 460px; min-width: 0; height: 46px; cursor: ew-resize; touch-action: none; border-radius: 6px; }
.readout { font-size: 15px; font-weight: 500; min-width: 150px; }
.readout small { display: block; font: 400 10px var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; }
.toggle span { width: 26px; height: 15px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
.toggle span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.toggle input:checked + span { background: var(--ink); }
.toggle input:checked + span::after { transform: translateX(11px); }
.hint { font-size: 12px; color: var(--muted); margin-left: auto; }
.about { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; min-height: 18px; }
.about b { font-weight: 600; font-size: 13px; }
.about p { margin: 0; font-size: 13px; color: var(--muted); max-width: 78ch; min-width: 0; }
main { flex: 1; position: relative; min-height: 0; }
main canvas { position: absolute; left: 0; top: 0; display: block; }
[hidden] { display: none !important; }
@media (max-width: 640px) { .hint { display: none; } .tabs { margin-left: 0; } .tabs button kbd { display: none; } }
</style>

<header>
  <div class="row">
    <h1>Timeline scale <span>Margin · study</span></h1>
    <div class="tabs" role="group" aria-label="Rail options" id="tabs"></div>
  </div>
  <div class="row">
    <canvas id="slider" tabindex="0" role="slider" aria-label="Scale" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1"></canvas>
    <div class="readout" aria-live="polite"><small>Looking at</small><span id="level">Days of the week</span></div>
    <label class="toggle"><input type="checkbox" id="snap" checked><span></span>Snap to scales</label>
    <div class="hint">Pinch on the trackpad or drag the slider · scroll to move in time · keys 1–8</div>
  </div>
  <div class="about"><b id="optName"></b><p id="optText"></p></div>
</header>
<main id="main">
  <canvas id="view"></canvas>

<script>
// ---------- options ----------
const OPTIONS = [
  { id: "ruler", group: "Ruler", name: "Original", text: "The first ruler: day, week and month ticks on a spine." },
  { id: "hairline", group: "Ruler", name: "Hairline", text: "One hairline with a tick per day, week and month in fixed proportions. Ticks thin out and fade as they crowd; the unit you are looking at is drawn darkest. A dot marks your latest capture." },
  { id: "dots", group: "Ruler", name: "Dots", text: "No spine. Each tick is a line while it has room and shrinks into a dot as it gets crowded, so zooming out turns the ruler into a dotted line, and zooming in grows it back." },
  { id: "vernier", group: "Ruler", name: "Vernier", text: "Two-sided. The unit you are looking at ticks on the right; the next larger unit ticks on the left. Zooming out, the fine ticks cross over and become the coarse ones." },
  { id: "beads", group: "Beads", name: "Original", text: "The first beads, one per day: liquid drops that melt into one per week, then per month." },
  { id: "pearls", group: "Beads", name: "Pearls", text: "One crisp pearl per day on a hairline, sized by how much happened. Zooming out, a week's pearls roll into one larger pearl, with the count inside." },
  { id: "rings", group: "Beads", name: "Glass", text: "The liquid version drawn as an outline: bubbles in a thin glass tube. They still flow together and split apart, but read lighter." },
  { id: "abacus", group: "Beads", name: "Abacus", text: "One bead per day, and beads never merge. Zooming out slides them along the string into stacks per week or month, so the length of a stack shows how many days you worked." },
];
const LEVEL_NAMES = ["1 day", "Days of the week", "Weeks of the month", "Months"];
const SLIDER_LABELS = ["Day", "Week", "Month", "Months"];

// ---------- data: four months of captures, seeded ----------
const DAY = 864e5;
const START = Date.UTC(2026, 5, 29);              // Monday, June 29 2026
const TODAY = Date.UTC(2026, 9, 18);              // Sunday, October 18
const N = Math.round((TODAY - START) / DAY) + 1;  // days shown
const dateOf = d => new Date(START + Math.floor(d) * DAY);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(7);
const caps = [];
let img = 0;
for (let d = 0; d < N - 1; d++) {
  const wd = d % 7;
  const crunch = d > N - 14;
  const p = crunch ? 0.92 : wd < 5 ? 0.6 : 0.22;
  if (rand() > p) continue;
  const sessions = 1 + (rand() < 0.45) + (rand() < (crunch ? 0.5 : 0.12));
  let hour = 9 + rand() * 3;
  for (let s = 0; s < sessions; s++) {
    let n = 2 + Math.floor(rand() * (crunch ? 7 : 5));
    let h = hour;
    for (let k = 0; k < n; k++) {
      h += 0.05 + rand() * 0.32;
      if (rand() > 0.62) img = (img + 1 + Math.floor(rand() * 4)) % THUMBS.length;
      caps.push({ t: d + Math.min(h, 23.9) / 24, img });
    }
    hour = h + 1.5 + rand() * 4;
    if (hour > 22) break;
  }
}
caps.sort((a, b) => a.t - b.t);
const times = Float64Array.from(caps.map(c => c.t));
const images = THUMBS.map(src => { const im = new Image(); im.src = src; im.onload = () => dirty = true; return im; });

// Buckets per level: 0 and 1 are days, 2 weeks (Monday start), 3 months.
const monthKey = d => { const x = dateOf(d); return x.getUTCFullYear() * 12 + x.getUTCMonth(); };
function buckets(L) {
  const out = [];
  if (L <= 1) for (let d = 0; d < N; d++) out.push({ s: d, e: d + 1 });
  else if (L === 2) for (let d = 0; d < N; d += 7) out.push({ s: d, e: Math.min(N, d + 7) });
  else { let s = 0; for (let d = 1; d <= N; d++) if (d === N || monthKey(d) !== monthKey(s)) { out.push({ s, e: d }); s = d; } }
  let i = 0;
  for (const b of out) { b.items = []; while (i < caps.length && caps[i].t < b.e) { if (caps[i].t >= b.s) b.items.push(i); i++; } }
  return out;
}
const BUCKETS = [0, 1, 2, 3].map(buckets);

// Sessions: captures less than 45 minutes apart.
const sessions = [];
for (let i = 0; i < caps.length; i++) {
  const last = sessions[sessions.length - 1];
  if (last && caps[i].t - last.e < 0.75 / 24 && Math.floor(caps[i].t) === Math.floor(last.s)) { last.e = caps[i].t; last.n++; }
  else sessions.push({ s: caps[i].t, e: caps[i].t, n: 1 });
}

// Beads are per day: one bead for each day with captures, at the day's
// mean capture time, sized by how many captures it holds. Zooming out
// gathers a week's or a month's day-beads into one.
const beadT = [], beadN = [];
{ let i = 0; for (let d = 0; d < N; d++) { let sum = 0, n = 0; while (i < caps.length && caps[i].t < d + 1) { sum += caps[i].t; n++; i++; } if (n) { beadT.push(sum / n); beadN.push(n); } } }
const beadTimes = Float64Array.from(beadT), NB = beadT.length;
const monthBucket = new Int32Array(N);
BUCKETS[3].forEach((b, k) => { for (let d = b.s; d < b.e; d++) monthBucket[d] = k; });
const bucketIndex = (L, t) => { const d = Math.min(N - 1, Math.floor(t)); return L <= 1 ? d : L === 2 ? Math.floor(d / 7) : monthBucket[d]; };
const cent = [], rad = [], share = [], pearlR = [], bucketOf = [], rankIn = [], groupSize = [];
const RAD = { base: [2.6, 2.6, 3, 3], k: [0.9, 0.9, 1.0, 0.9], cap: [9, 9, 14, 17] };
const PRL = { base: [2.2, 2.2, 2.6, 2.6], k: [0.7, 0.7, 0.85, 0.75], cap: [7, 7, 11, 13.5] };
for (let L = 0; L < 4; L++) {
  const c = new Float64Array(NB), r = new Float32Array(NB), w = new Float32Array(NB), pr = new Float32Array(NB);
  const bi = new Int32Array(NB), rk = new Int32Array(NB), gs = new Int32Array(NB);
  const groups = new Map();
  for (let j = 0; j < NB; j++) { const k = bucketIndex(L, beadT[j]); bi[j] = k; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(j); }
  for (const members of groups.values()) {
    const total = members.reduce((a, j) => a + beadN[j], 0);
    const mean = members.reduce((a, j) => a + beadT[j] * beadN[j], 0) / total;
    members.forEach((j, q) => {
      c[j] = mean; w[j] = 1 / members.length; rk[j] = q; gs[j] = members.length;
      r[j] = Math.min(RAD.cap[L], RAD.base[L] + Math.sqrt(total) * RAD.k[L]);
      pr[j] = Math.min(PRL.cap[L], PRL.base[L] + Math.sqrt(total) * PRL.k[L]);
    });
  }
  cent.push(c); rad.push(r); share.push(w); pearlR.push(pr); bucketOf.push(bi); rankIn.push(rk); groupSize.push(gs);
}
const beadRange = (t0, t1) => [lower(beadTimes, t0), lower(beadTimes, t1)];

// ---------- geometry ----------
const TILE = [176, 62, 30, 13], GX = [12, 6, 4, 3], GY = [30, 6, 4, 3];
const PAD = [20, 10, 9, 12], EMPTY = [64, 26, 24, 44], ROWGAP = [20, 2, 2, 8];
const G = { labelRight: 104, railX: 142, contentX: 184 };
let viewW = 800, viewH = 600, LAY = [];

function layout(L) {
  const W = Math.max(60, viewW - G.contentX - 8);

const mono = () => getComputedStyle(document.body).getPropertyValue("--mono");

function railHairline(t0, t1) {
  const x = G.railX;
  spine(x, 0.16);
  const LEN = [4, 7, 11, 17];
  for (const b of boundaries(t0, t1)) {
    const a = smooth(4, 18, b.space);
    if (a < 0.02) continue;
    const e = Math.max(rulerFocus(b.u, 0.8), b.u / 6);
    const len = LEN[b.u] * (0.5 + 0.5 * a);
    ctx.strokeStyle = ink(a * (0.22 + 0.68 * e));
    ctx.lineWidth = e > 0.55 || b.u >= 2 ? 1 : hair();
    const y = ctx.lineWidth === 1 ? Math.round(b.y) + 0.5 : snapPx(b.y);
    ctx.beginPath(); ctx.moveTo(x - len, y); ctx.lineTo(x, y); ctx.stroke();
    if (b.u === 0 && b.hour % 3 === 0 && b.hour) {
      const la = smooth(18, 34, b.space);
      if (la > 0.02) { ctx.font = `400 8.5px ${mono()}`; ctx.fillStyle = ink(0.38 * la); ctx.fillText(String(b.hour).padStart(2, "0"), x + 6, b.y + 3); }
    }
  }
  nowDot(x);
}

function railDots(t0, t1) {
  const x = G.railX;
  const LEN = [5, 8, 12, 18];
  ctx.lineCap = "round";
  for (const b of boundaries(t0, t1)) {
    const vis = smooth(2.4, 5, b.space);
    if (vis < 0.02) continue;
    const m = smooth(6, 18, b.space);            // 1 a line, 0 a dot
    const e = Math.max(rulerFocus(b.u, 0.8), 0.25 + b.u * 0.12);
    ctx.strokeStyle = ctx.fillStyle = ink(vis * (0.25 + 0.65 * e));
    const len = LEN[b.u] * m;
    if (len > 1.2) {
      ctx.lineWidth = b.u >= 2 ? 1.25 : 1;
      ctx.beginPath(); ctx.moveTo(x - len, b.y); ctx.lineTo(x, b.y); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x - 0.5, b.y, 0.55 + 0.2 * b.u + 0.4 * (1 - m) * (b.u >= 1), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.lineCap = "butt";
  nowDot(x - 0.5);
}

function railVernier(t0, t1) {
  const x = G.railX;
  spine(x, 0.22);
  const tags = [];
  for (const b of boundaries(t0, t1)) {
    const vis = smooth(3, 12, b.space);
    if (vis < 0.02) continue;
    const wr = rulerFocus(b.u, 1);               // the unit you're looking at
    const wl = clamp(1 - Math.abs(Math.max(z, 1) + 1 - b.u)); // the next one up
    if (wr > 0.02) {
      ctx.strokeStyle = ink(vis * (0.2 + 0.6 * wr)); ctx.lineWidth = hair() * (wr > 0.6 ? 2 : 1);
      const y = snapPx(b.y);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 7 * wr, y); ctx.stroke();
    }
    if (wl > 0.02) {
      ctx.strokeStyle = ink(vis * (0.25 + 0.7 * wl)); ctx.lineWidth = 1;
      const y = Math.round(b.y) + 0.5;
      ctx.beginPath(); ctx.moveTo(x - 13 * wl, y); ctx.lineTo(x, y); ctx.stroke();
      if (wl > 0.4 && b.space > 30) tags.push([b, wl]);
    }
  }
  ctx.font = `400 8.5px ${mono()}`; ctx.textAlign = "right";
  if (G.labelRight >= 80) for (const [b, wl] of tags) {
    const d = dateOf(b.t);
    const tag = b.u === 0 ? String(b.hour).padStart(2, "0") : b.u === 1 ? WD[Math.floor(b.t) % 7].toUpperCase() : b.u === 2 ? "W" + isoWeek(d) : MON[d.getUTCMonth()].toUpperCase();
    ctx.fillStyle = ink(0.42 * smooth(0.4, 0.9, wl));
    ctx.fillText(tag, x - 17, b.y + 3);
  }
  ctx.textAlign = "left";
}

// ---------- bead variations ----------
function countLabels(list, inside) {
  ctx.font = `400 8.5px ${mono()}`;
  for (const c of list) {
    if (c.n < 2) continue;
    if (inside && c.r >= 8) { ctx.fillStyle = C.paper; ctx.textAlign = "center"; ctx.fillText(String(c.n), c.x, c.y + 3); ctx.textAlign = "left"; }
    else { ctx.fillStyle = ink(0.45 * c.a); ctx.fillText(String(c.n), c.x + c.r + 6, c.y + 3); }
  }
}
function clusters(fn) {
  const { A, B, f } = blend(), D = f < 0.5 ? A : B, sharp = clamp(1 - Math.abs(f - (f < 0.5 ? 0 : 1)) * 2.4);
  const map = new Map();
  return { A, B, f, D, sharp, add(i, x, y, r) { if (D < 2 || sharp <= 0) return; const k = bucketOf[D][i]; const c = map.get(k) || { n: 0, x, y, r, a: sharp }; c.n += beadN[i]; c.x = x; c.y = y; c.r = r; map.set(k, c); }, list: () => [...map.values()] };
}

function railPearls(t0, t1) {
  const x = G.railX;
  spine(x, 0.3);
  const cl = clusters();
  const { A, B, f } = cl;
  const [lo, hi] = beadRange(t0 - 31, t1 + 31);
  ctx.lineWidth = 1.25;
  for (let i = lo; i < hi; i++) {
    const y = lerp(Y(cent[A][i]), Y(cent[B][i]), f) - scrollY;
    const r = lerp(pearlR[A][i], pearlR[B][i], f);
    if (y < -20 || y > viewH + 20) continue;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = ink(1); ctx.fill();
    ctx.strokeStyle = C.paper; ctx.stroke();
    cl.add(i, x, y, r);
  }
  countLabels(cl.list(), true);
}

function railRings(t0, t1) {
  const half = 30, S = DPR;
  const W = Math.ceil(half * 2 * S), H = Math.ceil(viewH * S);
  if (!field || field.length !== W * H) { field = new Float32Array(W * H); strip.width = W; strip.height = H; pixels = stx.createImageData(W, H); }
  field.fill(0);
  const cx = half * S;
  const cl = clusters();
  const { A, B, f } = cl;
  const [lo, hi] = beadRange(t0 - 31, t1 + 31);
  for (let i = lo; i < hi; i++) {
    const y = lerp(Y(cent[A][i]), Y(cent[B][i]), f) - scrollY;
    const r = lerp(pearlR[A][i], pearlR[B][i], f) * 1.15;
    if (y < -r * 3 || y > viewH + r * 3) continue;
    cl.add(i, G.railX, y, r);
    const wt = lerp(share[A][i], share[B][i], f);
    const R = r * S, R2 = R * R, ext = Math.ceil(R * 2.2), py = y * S;
    const x0 = Math.max(0, Math.floor(cx - ext)), x1 = Math.min(W - 1, Math.ceil(cx + ext));
    const y0 = Math.max(0, Math.floor(py - ext)), y1 = Math.min(H - 1, Math.ceil(py + ext));
    for (let yy = y0; yy <= y1; yy++) {
      const dy = yy - py, row = yy * W;
      for (let xx = x0; xx <= x1; xx++) { const dx = xx - cx; const q = R2 / (dx * dx + dy * dy + 0.5); field[row + xx] += wt * q * q; }
    }
  }
  const lw = 1.35 * S;
  const line = new Float32Array(W);
  for (let xx = 0; xx < W; xx++) { const dx = xx - cx; const q = (lw * lw) / (dx * dx + 0.5); line[xx] = q * q; }
  const [r, g, b] = C.rgb.split(",").map(Number), data = pixels.data;
  const v = k => field[k] + line[k % W];
  const width = 0.5 * S;
  for (let yy = 0; yy < H; yy++) {
    for (let xx = 0; xx < W; xx++) {
      const k = yy * W + xx, o = k * 4;
      const val = v(k);
      let a = 0;
      if (val > 4) a = 0.05;
      else if (val > 0.3 && xx > 0 && xx < W - 1 && yy > 0 && yy < H - 1) {
        const gx = (v(k + 1) - v(k - 1)) / 2, gy = (v(k + W) - v(k - W)) / 2;
        const g = Math.sqrt(gx * gx + gy * gy) + 1e-6;
        const dist = (val - 1) / g;
        a = clamp(1 - Math.abs(dist) / width) * 0.95;
        if (val > 1) a = Math.max(a, 0.05);
      }
      data[o] = r; data[o + 1] = g; data[o + 2] = b; data[o + 3] = a * 255;
    }
  }
  stx.putImageData(pixels, 0, 0);
  ctx.drawImage(strip, G.railX - half, 0, half * 2, viewH);
  countLabels(cl.list().map(c => ({ ...c, a: c.a })), false);
}

const ABACUS = [6, 6, 4.4, 3.2];
function abacusY(L, i) {
  const n = groupSize[L][i];
  if (n === 1) return Y(cent[L][i]);
  const b = BUCKETS[L][bucketOf[L][i]], k = rankIn[L][i];
  const span = Y(b.e) - Y(b.s);
  const d = lerp(ABACUS[Math.floor(z)], ABACUS[Math.min(3, Math.floor(z) + 1)], z - Math.floor(z));
  const pitch = Math.min(d + 1.6, (span * 0.72) / (n - 1));
  return Y(cent[L][i]) + (k - (n - 1) / 2) * pitch;
}
function railAbacus(t0, t1) {
  const x = G.railX;
  spine(x, 0.3);
  const cl = clusters();
  const { A, B, f } = cl;
  const d = lerp(ABACUS[A], ABACUS[B], f);
  const [lo, hi] = beadRange(t0 - 31, t1 + 31);
  ctx.lineWidth = d > 3 ? 1 : 0.6;
  const ends = new Map();
  for (let i = lo; i < hi; i++) {
    const y = lerp(abacusY(A, i), abacusY(B, i), f) - scrollY;
    if (y < -10 || y > viewH + 10) continue;
    ctx.beginPath(); ctx.arc(x, y, d / 2, 0, Math.PI * 2);
    ctx.fillStyle = ink(1); ctx.fill();
    ctx.strokeStyle = C.paper; ctx.stroke();
    if (cl.D >= 2) { const k = bucketOf[cl.D][i]; const e = ends.get(k) || { n: 0, lo: y, hi: y }; e.n += beadN[i]; e.lo = Math.min(e.lo, y); e.hi = Math.max(e.hi, y); ends.set(k, e); }
  }
  if (cl.sharp > 0) {
    ctx.font = `400 8.5px ${mono()}`; ctx.fillStyle = ink(0.45 * cl.sharp);
    for (const e of ends.values()) if (e.n > 1) ctx.fillText(String(e.n), x + 8, (e.lo + e.hi) / 2 + 3);
  }
}
const RAILS = { ruler: railRuler, beads: railBeads, brackets: railBrackets, tide: railTide, gears: railGears, hairline: railHairline, dots: railDots, vernier: railVernier, pearls: railPearls, rings: railRings, abacus: railAbacus };

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, viewW, viewH);
  const [t0, t1] = visibleRange();
  drawLabels(t0, t1);
  drawTiles(t0, t1);
  RAILS[OPTIONS[option].id](t0, t1);
  // Soft fade under the header so content scrolls away quietly.
  const g = ctx.createLinearGradient(0, 0, 0, 14);
  g.addColorStop(0, C.paper); g.addColorStop(1, C.paper + "00");
  ctx.fillStyle = g; ctx.fillRect(G.contentX - 4, 0, viewW, 14);
}

// ---------- slider: a ruler, like the reference ----------
let sliderDrag = false;
function sliderGeom() { const w = slider.width / DPR; return { x0: 12, x1: w - 14, w, h: slider.height / DPR }; }
function drawSlider() {
  const { x0, x1, h } = sliderGeom();
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.clearRect(0, 0, slider.width, slider.height);
  const mid = 18, hx = x0 + (z / 3) * (x1 - x0);
  const n = 30;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (i / n) * (x1 - x0);
    const major = i % 10 === 0;
    const lift = 7 * Math.exp(-Math.pow((x - hx) / 20, 2));
    const len = (major ? 13 : 6) + lift;
    sctx.strokeStyle = major ? ink(0.85) : ink(0.3 + 0.4 * lift / 7);
    sctx.lineWidth = major ? 1.25 : 1;
    sctx.beginPath(); sctx.moveTo(Math.round(x) + 0.5, mid - len); sctx.lineTo(Math.round(x) + 0.5, mid + len); sctx.stroke();
  }
  sctx.fillStyle = ink(1);
  sctx.beginPath(); sctx.arc(hx, mid, 6.5, 0, Math.PI * 2); sctx.fill();
  sctx.font = `400 10px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
  sctx.textAlign = "center";
  SLIDER_LABELS.forEach((l, i) => {
    const x = x0 + (i / 3) * (x1 - x0);
    sctx.fillStyle = ink(0.35 + 0.65 * clamp(1 - Math.abs(z - i)));
    sctx.textAlign = i === 0 ? "left" : i === 3 ? "right" : "center";
    sctx.fillText(l.toUpperCase(), i === 0 ? x0 - 4 : i === 3 ? x1 + 4 : x, h - 3);
  });
}
function sliderZ(e) { const { x0, x1 } = sliderGeom(); const r = slider.getBoundingClientRect(); return clamp((e.clientX - r.left - x0) / (x1 - x0)) * 3; }
slider.addEventListener("pointerdown", e => { sliderDrag = true; slider.setPointerCapture(e.pointerId); snapTo = null; setZ(sliderZ(e)); });
slider.addEventListener("pointermove", e => { if (sliderDrag) setZ(sliderZ(e)); });
slider.addEventListener("pointerup", () => { sliderDrag = false; anchorY = viewH / 2; snapSoon(); });
slider.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { goTo(Math.min(3, Math.floor(z + 0.01) + 1)); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { goTo(Math.max(0, Math.ceil(z - 0.01) - 1)); e.preventDefault(); }
});
function goTo(level) { anchorY = viewH / 2; if (reduceMotion) setZ(level); else snapTo = level; }

// ---------- input on the archive ----------
main.addEventListener("wheel", e => {
  e.preventDefault();
  const r = main.getBoundingClientRect();
  if (e.ctrlKey) {
    snapTo = null;
    anchorY = e.clientY - r.top;
    setZ(z + e.deltaY * 0.011, anchorY);
    snapSoon();
  } else {
    scrollY += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
    clampScroll(); dirty = true;
  }
}, { passive: false });
// Safari's pinch.
let gz = 1;
main.addEventListener("gesturestart", e => { e.preventDefault(); gz = z; snapTo = null; });
main.addEventListener("gesturechange", e => { e.preventDefault(); const r = main.getBoundingClientRect(); anchorY = e.clientY - r.top; setZ(gz - Math.log2(e.scale) * 1.15, anchorY); });
main.addEventListener("gestureend", e => { e.preventDefault(); snapSoon(); });
// Touch: drag to scroll.
let touchY = null;
main.addEventListener("pointerdown", e => { if (e.pointerType === "touch") { touchY = e.clientY; main.setPointerCapture(e.pointerId); } });
main.addEventListener("pointermove", e => { if (touchY !== null) { scrollY -= e.clientY - touchY; touchY = e.clientY; clampScroll(); dirty = true; } });
main.addEventListener("pointerup", () => { touchY = null; });
main.style.touchAction = "none";

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= OPTIONS.length) pick(n - 1);
  if (e.key === "+" || e.key === "=") goTo(Math.max(0, Math.ceil(z - 0.01) - 1));
  if (e.key === "-") goTo(Math.min(3, Math.floor(z + 0.01) + 1));
});

// ---------- chrome ----------
const tabs = document.getElementById("tabs");
const buttons = [];
OPTIONS.forEach((o, i) => {
  if (i === 0 || OPTIONS[i - 1].group !== o.group) {
    const g = document.createElement("span"); g.className = "group"; g.textContent = o.group; tabs.appendChild(g);
  }
  const b = document.createElement("button");
  b.type = "button"; b.id = "opt-" + o.id;
  b.innerHTML = `${o.name}<kbd>${i + 1}</kbd>`;
  b.addEventListener("click", () => pick(i));
  tabs.appendChild(b); buttons.push(b);
});
function pick(i) {
  option = i;
  buttons.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
  document.getElementById("optName").textContent = OPTIONS[i].group + " · " + OPTIONS[i].name;
  document.getElementById("optText").textContent = OPTIONS[i].text;
  try { localStorage.setItem("timeline-study-v2", String(i)); } catch (e) {}
  dirty = true;
}
function updateReadout() {
  const lvl = Math.round(z);
  const el = document.getElementById("level");
  if (el.textContent !== LEVEL_NAMES[lvl]) el.textContent = LEVEL_NAMES[lvl];
  slider.setAttribute("aria-valuenow", z.toFixed(2));
  slider.setAttribute("aria-valuetext", LEVEL_NAMES[lvl]);
}

// ---------- loop ----------
function frame() {
  if (snapTo !== null) {
    const d = snapTo - z;
    if (Math.abs(d) < 0.002) { setZ(snapTo, anchorY); snapTo = null; }
    else setZ(z + d * 0.16, anchorY);
  }
  if (dirty) { dirty = false; draw(); drawSlider(); }
  requestAnimationFrame(frame);
}

readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let start = 1;
try { const s = parseInt(localStorage.getItem("timeline-study-v2"), 10); if (s >= 0 && s < OPTIONS.length) start = s; } catch (e) {}
pick(start);
resize();
new ResizeObserver(resize).observe(main);
if (document.fonts) document.fonts.ready.then(() => { dirty = true; });
updateReadout();
requestAnimationFrame(frame);
</script>
</body></html>
